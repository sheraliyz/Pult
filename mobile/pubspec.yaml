name: pult
description: "Pult — server boshqaruvi: terminal va fayllar (Android)."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  dartssh2: ^4.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  pinenacl: ^0.6.0
  re_editor: ^0.10.0
  re_highlight: ^0.0.3
  url_launcher: ^6.3.2
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.7

flutter:
  uses-material-design: true
  fonts:
    # Geist and Doto: SIL Open Font License (assets/fonts/*-OFL.txt). Static
    # instances of the Google Fonts variable files, made with fontTools.
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
